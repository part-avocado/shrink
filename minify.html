<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>big boi cipher</title><style>*, *::before, *::after{box-sizing: border-box;}input, textarea {display: block; width:100%;}.row{display: flex; justify-content: space-between;}.link{background:none; color: #8b7fd1;border:0; padding: 0; margin: 0; text-decoration: 0;}body{min-height: 100vh;display:flex;align-items:flex-start;justify-content:center;padding:1rem;font-family:system-ui,sans-serif;color:#4a3b6b;background: #bcd7f6;background: #dccff3;line-height: 1.6; font-weight: 600;}input, textarea, button {font:inherit;margin-bottom: 0.6rem;}input, textarea {padding: 0.7rem 0.9rem; border: 2px solid #8b6fd1; border-radius: 0.9rem; color: #4a3b6b;}main {width:100%;max-width: 34rem;}textarea {min-height: 8rem;resize: vertical;}textarea[readonly] {background: rgba(255,255,255,0.5);border-style: dashed;}button {padding: 0.8rem 1rem;border-radius: 0.9rem;cursor: pointer;margin-right: 0.5rem;background: #8b7fd1;color: #fff;border: 0;font-weight: 700;}</style></head><main><body><h1>big boi encrypter</h1><p>a very good encryption no tracking dws :nodnod:</p><div class="row"> Key:<button class='link'onclick="paste(k)">paste</button></div><input id="k" placeholder="insert env vars here" aria-label="key"><div class="row">Input: <button class='link' onclick="paste(i)">paste</button></div><textarea id="i" placeholder="text here, or encoded text here" aria-label="input"></textarea><button onclick="go(0)">encode</button><button onclick="go(1)">decode</button><br>Output: <textarea id="o" readonly aria-label="output"></textarea><div id="m"></div><button class="cope" id="cp" onclick="copy()">copy output</button><script>let A="0123456789abcdef";function H(k){let h=2166136261;for(const c of k)h=Math.imul(h^c.codePointAt(0), 16777619);return h>>>0}function go(d){let s=H(k.value), p=0, t=i.value, r='';try{if(!d){for(let x of new TextEncoder().encode(t)){s=Math.imul(s,1664525)+1013904223>>>0;x^=s>>>24;x=(x<<3 | x>>5)&255;x=x+p&255;p=x;r+=A[x>>4]+A[x&15];}}else{let q=[...t.toLowerCase()].filter(c=>A.includes(c));if(q.length%2 || !q.length) throw 0;let y=[];for (let n=0;n<q.length;n+=2){let c=A.indexOf(q[n])*16+A.indexOf(q[n+1]);s=Math.imul(s, 1664525)+1013904223 >>>0;let x=c-p&255;p=c;x=(x>>3 | x<<5)&255;y.push(x^s>>>24);}r=new TextDecoder('utf-8', {fatal:true}).decode(new Uint8Array(y));}o.value=r;m.textContent='';} catch(z){o.value='';m.textContent='couldnt decode';}}async function copy(){if(!o.value) return;try{await navigator.clipboard.writeText(o.value);} catch{o.select();document.execCommand('copy');}cp.textContent='copied!';setTimeout(() => cp.textContent='copy output', 1500);}async function paste(el){try{el.value = await navigator.clipboard.readText();}catch{el.focus();}}</script> </body></main></html>
